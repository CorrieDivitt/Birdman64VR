# Release builds ("build on first run", docs/notes/first-run-build.md):
# a workflow_dispatch artifact, GitHub release assets on `v*` tags.
#
# Windows: Birdman64VR.exe (no console, no game C; the game module is built on
# the player's machine) + the bundled zig compiler + the Khronos OpenXR loader
# (Birdman64VR, r1) + "Start in VR.cmd" + licence notices.
# Windows runs a smoke test: `--build-game` downloads the pinned decomp and
# compiles it in CI, and the dylib test runs against the result (an absolute
# PW64_GAME_DLL is required: cargo runs tests with the crate dir as cwd).
# Quest: a release-signed APK for the Meta Quest 3 (signer pinned, see the
# quest job). Birdman64VR ships no Linux build or phone APK (Birdman64 does).
# The jobs are independent: a failed one never blocks the others' uploads.
#
# The zip carries READ ME FIRST.txt; the debug symbols asset
# is renamed Birdman64VR-windows-x64-debug-symbols.pdb; the release body comes
# from packaging/release-notes.md (all jobs pass the same body_path). Tags
# with a `-` (e.g. v1.5.2-pre1) publish as prereleases.
#
# The zip contains only our code + zig + licences: no ROM, no decomp files,
# no extracted assets (CONTRIBUTING.md). The decomp's MIT licence is mentioned
# in DECOMP-LICENSE-NOTE.txt (it ships with the download itself).

name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # zig 0.16.0 toolchain (MIT; bundles clang/LLD 21). Only zig[.exe] is
  # bundled; the zip also carries zig's own LICENSE and the LLVM licence
  # (zig.exe contains LLVM/clang/LLD).
  ZIG_WIN_URL: https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
  ZIG_WIN_SHA256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
  ZIG_LINUX_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
  ZIG_LINUX_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  # Birdman64VR: the Khronos OpenXR loader (Apache-2.0), x64/bin of the
  # OpenXR-SDK-Source release zip; the same version as the Quest APK's
  # (packaging/android/build-apk.sh). It ships next to the exe with its licence.
  OPENXR_WIN_URL: https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-1.1.54/openxr_loader_windows-1.1.54.zip
  OPENXR_WIN_SHA256: 925b9ddab4d0b795d8900d2ef95feebc89c44d5fc03acf6e495ff0c19ca8cfb8
  LLVM_LICENSE_URL: https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-21.1.0/llvm/LICENSE.TXT
  # appimagetool 1.9.1 (stable, static x86_64 build).
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  windows:
    name: Windows release (zip)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # B6: static CRT so the exe needs no VC++ redistributable. Only the
      # exe: the game module links no CRT at all (T1 thunks).
      RUSTFLAGS: -Ctarget-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ (read-only reference, needed by build.rs)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build Birdman64VR.exe (first-run flavour, no console)
        run: cargo build --release -p birdman64 --no-default-features --features first-run,gui-subsystem

      # B6: the runners have the VC++ runtime installed, so a smoke run can't
      # catch a dynamic CRT; check the import table instead. Players must not
      # need any redistributable.
      - name: exe imports no C/C++ runtime DLL
        shell: pwsh
        run: |
          $dlls = & "C:\Program Files\LLVM\bin\llvm-objdump.exe" -p target/release/birdman64.exe |
            Select-String "DLL Name: (.*)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $dlls
          $bad = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' }
          if ($bad) { Write-Error "runtime DLL imports: $bad"; exit 1 }

      - name: download + verify zig
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp | Out-Null
          Invoke-WebRequest -Uri $env:ZIG_WIN_URL -OutFile tmp/zig.zip
          $h = (Get-FileHash tmp/zig.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:ZIG_WIN_SHA256) { throw "zig sha256 mismatch: $h" }
          Expand-Archive tmp/zig.zip -DestinationPath tmp/zigdl
          New-Item -ItemType Directory -Force dist/Birdman64VR/toolchain/zig | Out-Null
          Copy-Item tmp/zigdl/zig-x86_64-windows-0.16.0/zig.exe dist/Birdman64VR/toolchain/zig/
          Copy-Item tmp/zigdl/zig-x86_64-windows-0.16.0/LICENSE dist/Birdman64VR/toolchain/zig/LICENSE
          & dist/Birdman64VR/toolchain/zig/zig.exe version

      - name: download + verify the OpenXR loader (Birdman64VR)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp, dist/Birdman64VR/licenses | Out-Null
          Invoke-WebRequest -Uri $env:OPENXR_WIN_URL -OutFile tmp/openxr.zip
          $h = (Get-FileHash tmp/openxr.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:OPENXR_WIN_SHA256) { throw "OpenXR loader sha256 mismatch: $h" }
          Expand-Archive tmp/openxr.zip -DestinationPath tmp/openxr
          Copy-Item tmp/openxr/x64/bin/openxr_loader.dll dist/Birdman64VR/
          Copy-Item tmp/openxr/share/doc/openxr/LICENSE dist/Birdman64VR/licenses/OpenXR-loader-LICENSE.txt

      - name: LLVM licence (zig bundles clang/LLD)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Birdman64VR/licenses | Out-Null
          Invoke-WebRequest -Uri $env:LLVM_LICENSE_URL -OutFile dist/Birdman64VR/licenses/LLVM-LICENSE.txt

      - name: THIRD_PARTY_LICENSES.html (cargo-about)
        shell: pwsh
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo about generate about.hbs --output-file dist/Birdman64VR/THIRD_PARTY_LICENSES.html

      - name: assemble the zip
        shell: pwsh
        run: |
          Copy-Item target/release/birdman64.exe dist/Birdman64VR/Birdman64VR.exe
          Copy-Item 'packaging/windows/Start in VR.cmd' dist/Birdman64VR/
          Copy-Item packaging/DECOMP-LICENSE-NOTE.txt dist/Birdman64VR/
          Copy-Item 'packaging/READ ME FIRST.txt' dist/Birdman64VR/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/Birdman64VR/
          Compress-Archive -Path dist/Birdman64VR -DestinationPath Birdman64VR-windows-x64.zip
          Copy-Item target/release/birdman64.pdb Birdman64VR-windows-x64-debug-symbols.pdb

      # Smoke test: the real first-run path on a clean data dir. No ROM is
      # given, so it builds the module from the network decomp and exits 0.
      - name: smoke --build-game
        shell: pwsh
        env:
          PW64_DATA_DIR: ${{ github.workspace }}/tmp/first-run-data
          PW64_NO_AUDIO: '1'
          PW64_NO_INPUT: '1'
          # never wait on an (invisible) message box in CI
          PW64_NO_DIALOGS: '1'
        run: |
          # A windows-subsystem exe: `&` would not wait for it and its
          # stdout/stderr go nowhere, so start it explicitly, wait, and
          # print the captured output.
          $p = Start-Process -FilePath dist/Birdman64VR/Birdman64VR.exe -ArgumentList '--build-game' `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput tmp/build-game.out -RedirectStandardError tmp/build-game.err
          Get-Content tmp/build-game.out, tmp/build-game.err
          if ($p.ExitCode -ne 0) { throw "--build-game exited $($p.ExitCode)" }

      - name: dylib test on the built module
        shell: pwsh
        env:
          PW64_DATA_DIR: ${{ github.workspace }}/tmp/first-run-data
        run: |
          $mod = Get-ChildItem tmp/first-run-data/cache/game/*/pw64game.dll | Select-Object -First 1
          if (-not $mod) { throw "no pw64game.dll under tmp/first-run-data/cache/game/" }
          $env:PW64_GAME_DLL = $mod.FullName  # absolute: cargo runs tests from the crate dir
          cargo test --release -p pw64-game --no-default-features --features dylib

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $h1 = (Get-FileHash Birdman64VR-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash Birdman64VR-windows-x64-debug-symbols.pdb -Algorithm SHA256).Hash.ToLower()
          "$h1  Birdman64VR-windows-x64.zip`n$h2  Birdman64VR-windows-x64-debug-symbols.pdb" |
            Out-File SHA256SUMS-windows.txt -Encoding ascii

      # Build provenance for the released zip (verifiable with
      # `gh attestation verify`, see README Troubleshooting).
      # Skipped while the repo is private: attestations are unavailable for
      # user-owned private repos and the step would fail the release.
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: Birdman64VR-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Birdman64VR-windows-x64
          path: |
            Birdman64VR-windows-x64.zip
            Birdman64VR-windows-x64-debug-symbols.pdb
            SHA256SUMS-windows.txt
      - name: github release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            Birdman64VR-windows-x64.zip
            Birdman64VR-windows-x64-debug-symbols.pdb
            SHA256SUMS-windows.txt

  # Birdman64VR: the Meta Quest 3 APK, release flavour + Quest flavour
  # (docs/notes/android.md, build-apk.sh --quest): attached to the GitHub
  # release ONLY when signed with the release key (secrets
  # ANDROID_KEYSTORE_B64 / _PASSWORD / ANDROID_KEY_ALIAS): a debug-signed APK
  # could never be updated in place by a later release. The release key's
  # certificate SHA-256 is pinned in the repository variable
  # ANDROID_CERT_SHA256 (public, not a secret).
  quest:
    name: Quest release (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: cargo-about (THIRD_PARTY_LICENSES.html)
        run: cargo about --version || cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: build-apk.sh --release-flavour --quest
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bash packaging/android/build-apk.sh --release-flavour --quest
          unzip -l target/android-apk/Birdman64-android-arm64-quest-unsigned.apk \
            | grep -q 'lib/arm64-v8a/libopenxr_loader.so'
      # The only step that sees the release key (SDK tools only: no cargo,
      # no build scripts).
      - name: sign with the release key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # build-apk.sh fails if the APK is signed by any other key.
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: >
          bash packaging/android/build-apk.sh --sign-only
          target/android-apk/Birdman64-android-arm64-quest-unsigned.apk
      - name: signed?
        id: signed
        env:
          PINNED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -f target/android-apk/Birdman64-android-arm64.apk ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ -z "$PINNED" ]; then
              echo "::error::release tag without the ANDROID_CERT_SHA256 repository variable"
              exit 1
            fi
            cp target/android-apk/Birdman64-android-arm64.apk Birdman64VR-quest.apk
            sha256sum Birdman64VR-quest.apk > SHA256SUMS-quest.txt
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::release tag without the Android release key secrets: no APK"
            exit 1
          else
            echo "::warning::no release keystore secrets: debug-signed APK, not attached to a release"
            cp target/android-apk/Birdman64-android-arm64-debugsigned.apk Birdman64VR-quest-debugsigned.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@v2
        if: ${{ steps.signed.outputs.signed == 'true' && !github.event.repository.private }}
        with:
          subject-path: Birdman64VR-quest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Birdman64VR-quest
          path: |
            Birdman64VR-quest*.apk
            SHA256SUMS-quest.txt
          if-no-files-found: warn
      - name: github release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signed.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            Birdman64VR-quest.apk
            SHA256SUMS-quest.txt
